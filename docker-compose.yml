services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://whisperchat:whisperchat@db:5432/whisperchat?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whisperchat
      POSTGRES_PASSWORD: whisperchat
      POSTGRES_DB: whisperchat
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whisperchat -d whisperchat"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
